<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<script>/* 카톡·라인 인앱 → 외부 브라우저 자동 탈출, 실패 시 라이트 모드 폴백 (types.html과 동일) */
try{var __ua=navigator.userAgent||'';
if(/KAKAOTALK/i.test(__ua)){location.href='kakaotalk://web/openExternal?url='+encodeURIComponent(location.href);}
else if(/\bLine\//i.test(__ua)&&location.search.indexOf('openExternalBrowser')<0){location.href=location.href+(location.search?'&':'?')+'openExternalBrowser=1';}
else if(/Android/i.test(__ua)&&/Instagram|FBAN|FBAV|NAVER\(inapp|DaumApps|Twitter/i.test(__ua)){try{if(!sessionStorage.getItem('extEsc')){sessionStorage.setItem('extEsc','1');location.href='intent://'+location.host+location.pathname+location.search+'#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url='+encodeURIComponent(location.href)+';end';}}catch(e2){}}
}catch(e){}
try{var __iu=navigator.userAgent||'';
if(/KAKAOTALK|Instagram|FBAN|FBAV|Line\/|NAVER\(inapp|DaumApps/i.test(__iu)){var __ir=document.documentElement;__ir.classList.add('inapp-lite');
if(/KAKAOTALK|Instagram|FBAN|FBAV|Line\/|DaumApps/i.test(__iu))__ir.classList.add('inapp-heavy');}}catch(e){}</script>
<style id="inapp-lite-css">
  html.inapp-lite *{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
  html.inapp-heavy *{animation:none!important;transition:none!important}

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap"></noscript>
<style>
  :root{--ink:#241C26;--slate:#5B4E5C;--mut:#9A8C9C;--rose:#E85D8A;--rosed:#B93A67;--line:#F0DFE8;--gc:#E85D8A;--gbg:#FCEDF3;
    --serif:'Noto Serif KR',serif;--mono:ui-monospace,'SF Mono',Menlo,monospace}
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{background:linear-gradient(170deg,#FEF8FA 0%,#FBF7FC 55%,#F7F5FD 100%);color:var(--ink);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
    font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo',sans-serif;letter-spacing:-.02em;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  .app{width:100%;max-width:480px;margin:0 auto;padding:18px 20px calc(24px + env(safe-area-inset-bottom));flex:1;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;justify-content:space-between}
  .logo{font-size:18px;font-weight:900}.logo .dot{color:var(--rose)}.logo .lab{color:var(--rose);font-weight:800;letter-spacing:.5px}
  .tag{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--rosed);font-weight:700}
  .screen{display:none;flex:1;flex-direction:column}.screen.on{display:flex}
  /* 인트로 */
  .hero{margin:auto 0;text-align:center;padding:10px 0}
  .kicker{font-family:var(--mono);font-size:10.5px;letter-spacing:3px;color:var(--rosed);font-weight:700}
  .hero h1{font-family:var(--serif);font-size:36px;line-height:1.22;letter-spacing:-.02em;margin-top:12px;word-break:keep-all}
  .hero h1 em{font-style:normal;color:var(--rosed)}
  .hero p{margin-top:14px;color:var(--slate);font-size:15px;word-break:keep-all}
  .nick{margin-top:24px;width:100%;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;font:inherit;font-size:16px;text-align:center;background:#fff;color:var(--ink)}
  .nick::placeholder{color:var(--mut)}
  .cta{display:flex;align-items:center;justify-content:center;width:100%;min-height:58px;margin-top:14px;border:0;border-radius:99px;
    background:linear-gradient(180deg,#F27BA3,#DE5382);color:#fff;font:inherit;font-size:17px;font-weight:800;letter-spacing:-.01em;cursor:pointer;
    box-shadow:0 16px 30px -14px rgba(232,93,138,.75),inset 0 1.5px 0 rgba(255,255,255,.5);transition:transform .12s}
  .cta:active{transform:translateY(1px)}
  .cta.ghost{background:#fff;color:var(--rosed);border:1.5px solid rgba(232,93,138,.5);box-shadow:none;min-height:52px;font-size:15px}
  .fine{margin-top:12px;font-size:11.5px;color:var(--mut);word-break:keep-all}
  /* 문항 */
  .dots{display:flex;gap:6px;justify-content:center;margin:28px 0 12px}.dots i{width:26px;height:4px;border-radius:99px;background:var(--line);transition:background .2s}.dots i.on{background:var(--rose)}
  .qs{font-family:var(--mono);font-size:10.5px;letter-spacing:2px;color:var(--rosed);text-align:center;font-weight:700}
  .q{font-family:var(--serif);font-size:25px;line-height:1.38;text-align:center;margin-top:16px;word-break:keep-all;min-height:104px;display:flex;align-items:center;justify-content:center}
  .opts{display:flex;flex-direction:column;gap:12px;margin-top:24px}
  .opt{width:100%;text-align:left;border:1.5px solid var(--line);background:rgba(255,255,255,.92);border-radius:18px;padding:18px 18px;font:inherit;font-size:16.5px;font-weight:600;line-height:1.45;color:var(--ink);word-break:keep-all;cursor:pointer;
    box-shadow:0 16px 32px -28px rgba(36,28,38,.55);transition:transform .12s,border-color .12s,background .12s;-webkit-tap-highlight-color:transparent}
  .opt:active,.opt.on{transform:scale(.985);border-color:var(--rose);background:#FEF4F8}
  .back{margin-top:auto;padding-top:18px;text-align:center;font-size:12.5px;color:var(--mut);background:none;border:0;font:inherit;cursor:pointer}
  /* 결과 */
  .card{margin-top:14px;background:linear-gradient(170deg,#fff 0%,var(--gbg) 100%);border:1.5px solid color-mix(in srgb,var(--gc) 35%,#fff);border-radius:26px;padding:24px 20px 22px;text-align:center;
    box-shadow:0 34px 64px -38px color-mix(in srgb,var(--gc) 60%,transparent),inset 0 1px 0 #fff}
  .card img{height:172px;max-width:80%;object-fit:contain;filter:drop-shadow(0 18px 20px color-mix(in srgb,var(--gc) 38%,transparent))}
  .grp{display:inline-block;margin-top:10px;font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--gc);border:1px solid color-mix(in srgb,var(--gc) 45%,#fff);border-radius:99px;padding:4px 12px;font-weight:700}
  .code{font-family:var(--mono);font-size:36px;font-weight:800;letter-spacing:9px;margin:10px 0 0 9px;color:var(--gc);line-height:1}
  .tn{font-family:var(--serif);font-size:28px;margin-top:8px;line-height:1.2}
  .tl{color:var(--slate);font-size:14.5px;margin-top:10px;word-break:keep-all;line-height:1.55}
  .ax{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}
  .ax div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 2px}
  .ax b{display:block;font-family:var(--mono);font-size:17px;color:var(--gc)}.ax span{display:block;font-size:10.5px;color:var(--mut);margin-top:2px;letter-spacing:-.02em}
  .who{font-size:13px;color:var(--mut);margin-top:12px}
  .who b{color:var(--ink)}
  .foot{margin-top:auto;padding-top:16px;text-align:center;font-size:11px;color:var(--mut);line-height:1.7;word-break:keep-all}
  @media(max-width:360px){.hero h1{font-size:31px}.q{font-size:22px}.opt{font-size:15.5px;padding:16px}.code{font-size:32px}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><a class="logo" href="https://ratilab.com/?utm_source=ulsan_fest">RATI<span class="dot">.</span><span class="lab">lab</span></a><span class="tag">ULSAN UNIV · 5-SEC</span></div>

  <section class="screen on" id="sIntro">
    <div class="hero">
      <div class="kicker">RATI · 연애 애착 유형</div>
      <h1>4번만 고르면<br><em>내 연애 유형</em>이 나와요</h1>
      <p>정식 검사는 22문항이지만, 축제 버전은 축마다 하나씩 딱 4개. 5초면 끝나요.</p>
      <input class="nick" id="nick" type="text" maxlength="10" placeholder="닉네임 (선택 · 결과 카드에 표기)" autocomplete="off" enterkeyhint="go">
      <button class="cta" id="btnStart" type="button">시작하기 →</button>
      <p class="fine">재미와 자기이해용 콘텐츠 · 임상 진단이 아니에요 · 닉네임과 결과 유형만 익명 집계돼요</p>
    </div>
  </section>

  <section class="screen" id="sQuiz">
    <div class="dots" id="dots"></div>
    <div class="qs" id="qs"></div>
    <div class="q" id="qText"></div>
    <div class="opts" id="opts"></div>
    <button class="back" id="btnBack" type="button">← 이전</button>
  </section>

  <section class="screen" id="sResult">
    <div class="card" id="card">
      <img id="rImg" alt="" width="172" height="172">
      <div class="grp" id="rGrp"></div>
      <div class="code" id="rCode"></div>
      <div class="tn" id="rName"></div>
      <div class="tl" id="rLine"></div>
      <div class="ax" id="rAx"></div>
      <div class="who" id="rWho"></div>
    </div>
    <a class="cta" id="btnFull" href="https://ratilab.com/?utm_source=ulsan_fest">정식 22문항 검사하기 (무료) →</a>
    <button class="cta ghost" id="btnAgain" type="button">다시 하기</button>
    <div class="foot">축제 버전은 축당 1문항의 약식 판정이에요 · 정식 검사에서 4축 % · 멘헤라 지수까지 무료로 볼 수 있어요<br>© 2026 RATI Lab · ratilab.com</div>
  </section>
</div>

<script>
(function(){
  var Q=[{"ax": "io", "s": "연애", "q": "연인이 읽씹 6시간째. 근데 인스타 스토리는 올라온다.", "o": [["I", "스토리가 뜬 걸 보자마자, 왜 답 없냐고 물어본다"], ["O", "연락이 오면 나도 비슷한 시간을 두고 답한다"]]}, {"ax": "rb", "s": "썸", "q": "썸 상대가 내 친구들한테 나에 대해 물어보고 다닌다.", "o": [["R", "귀엽다 생각하고 넘긴다"], ["B", "살짝 부담스럽다. 아직 그럴 단계인가 싶다"]]}, {"ax": "tk", "s": "성향", "q": "연인에게 서운할 때, 나의 기본값.", "o": [["T", "그날 안에 말로 푼다"], ["K", "말하지 않는다. 대신 마음속으로 정리해둔다"]]}, {"ax": "au", "s": "성향", "q": "혼자 있을 때 문득 드는 생각.", "o": [["A", "다음에 뭐 하고 놀지"], ["U", "그 사람도 지금 내 생각을 할까"]]}];
  var POLE={"R": "다가감", "B": "선긋기", "A": "단단함", "U": "여림", "T": "표현", "K": "담아둠", "I": "부딪힘", "O": "물러섬"};
  var TN={RATI:'완벽주의형',RATO:'품어주는형',RAKI:'해결사형',RAKO:'버팀목형',RUTI:'올인형',RUTO:'맞춰주는형',RUKI:'속정형',RUKO:'여운형',BATI:'소신형',BATO:'자유형',BAKI:'과묵형',BAKO:'독립형',BUTI:'열정파형',BUTO:'직감형',BUKI:'충전형',BUKO:'불꽃형'};
  var TL={RATI:'계획도 다정도 완벽한 연애의 교과서',RATO:'곁에 있으면 따뜻해지는 보호자',RAKI:'위기에 제일 믿음직한 사람',RAKO:'말없이 곁을 지키는 든든한 사람',RUTI:'사랑에 전부를 거는 사람',RUTO:'맞춰주는 다정함의 극한',RUKI:'서운함도 애정이 커서 생기는 것',RUKO:'누구보다 깊게 사랑하고 오래 기억하는 사람',BATI:'할 말은 정확히 하는 사람',BATO:'구속받는 순간 매력을 잃는 사람',BAKI:'표정은 잔잔해도 속은 깊은 사람',BAKO:'혼자서도 충분히 완결된 사람',BUTI:'만나면 세상 제일 뜨겁고 즐거운 사람',BUTO:'관계의 균열을 먼저 감지하는 촉',BUKI:'주기적으로 혼자만의 계절이 오는 사람',BUKO:'뜨거울 때 가장 뜨거운 사람'};
  var GG={RA:['확신','#C98A1F','#FBF3E4'],RU:['낭만','#E85D8A','#FCEDF3'],BA:['여유','#3D9EA8','#EAF5F6'],BU:['반전','#7C4FD8','#F1EBFB']};

  var ENDPOINT='https://script.google.com/macros/s/AKfycbyHC6hr_7P6z-cwW4QLC33uHbPpnS7zDW-6LJ3dLTqsCP8rFKnTPX65GEu41erU-1WF/exec';
  var SID=(function(){try{var k='rati_sid',v=localStorage.getItem(k);if(!v){v=(Math.random().toString(36).slice(2,8))+Date.now().toString(36).slice(-4);localStorage.setItem(k,v);}return v;}catch(e){return 'anon'}})();
  function track(kind,data){try{if(location.hostname!=='ratilab.com')return;if(!ENDPOINT||ENDPOINT.indexOf('http')!==0)return;fetch(ENDPOINT,{method:'POST',mode:'no-cors',keepalive:true,headers:{'Content-Type':'text/plain'},
    body:JSON.stringify(Object.assign({kind:kind,ts:new Date().toISOString(),page:'event/ulsan',sid:SID,utm:'ulsan_fest'},data||{}))})}catch(e){}}

  var $=function(id){return document.getElementById(id)};
  var idx=0,ans=[],nick='',sent=false;
  function show(id){['sIntro','sQuiz','sResult'].forEach(function(s){$(s).classList.toggle('on',s===id)});window.scrollTo(0,0)}

  function renderQ(){
    var q=Q[idx];
    $('dots').innerHTML=Q.map(function(_,i){return '<i class="'+(i<=idx?'on':'')+'"></i>'}).join('');
    $('qs').textContent='Q'+(idx+1)+' / '+Q.length+' · '+q.s;
    $('qText').textContent=q.q;
    var order=Math.random()<.5?[0,1]:[1,0];
    $('opts').innerHTML=order.map(function(k){return '<button class="opt" type="button" data-k="'+k+'">'+q.o[k][1]+'</button>'}).join('');
    $('btnBack').style.visibility=idx===0?'hidden':'visible';
    Array.prototype.forEach.call($('opts').querySelectorAll('.opt'),function(b){b.addEventListener('click',function(){
      if(b.classList.contains('on'))return;b.classList.add('on');ans[idx]=parseInt(b.getAttribute('data-k'),10);
      setTimeout(function(){ if(idx===Q.length-1)renderResult(); else {idx++;renderQ()} },160);
    })});
  }
  function renderResult(){
    var pick={};Q.forEach(function(q,i){pick[q.ax]=q.o[ans[i]][0]});var code=pick.rb+pick.au+pick.tk+pick.io;
    var g=GG[code.slice(0,2)];
    document.documentElement.style.setProperty('--gc',g[1]);document.documentElement.style.setProperty('--gbg',g[2]);
    $('rImg').src='/chars/'+code+'.webp';$('rImg').alt=TN[code]+' 캐릭터';
    $('rGrp').textContent=g[0]+' 그룹';
    $('rCode').textContent=code;$('rName').textContent=TN[code];$('rLine').textContent=TL[code];
    $('rAx').innerHTML=code.split('').map(function(L){return '<div><b>'+L+'</b><span>'+POLE[L]+'</span></div>'}).join('');
    $('rWho').innerHTML=nick?'<b>'+esc(nick)+'</b>님의 축제 RATI':'나의 축제 RATI';
    show('sResult');
    if(!sent){sent=true;
      /* 무료 검사와 같은 test_done 행으로 기록 → 응답 탭에 참가자 한 줄 + 참여 n명·유형 분포 집계에 반영.
         문항수 4 · 정밀도 '약식(축제)' · 유입 ulsan_fest 로 실측 22문항과 구분된다. */
      track('test_done',{code:code,n:Q.length,acc:'약식(축제)',answers:code+' 4택',
        profile:{nick:nick||'',gender:'',age:'',mbti:''}});}
  }
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

  $('btnStart').addEventListener('click',function(){nick=$('nick').value.trim().slice(0,10);idx=0;ans=[];sent=false;show('sQuiz');renderQ()});
  $('nick').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();$('btnStart').click()}});
  $('btnBack').addEventListener('click',function(){if(idx>0){idx--;renderQ()}});
  $('btnAgain').addEventListener('click',function(){idx=0;ans=[];sent=false;show('sIntro');$('nick').value='';document.documentElement.style.setProperty('--gc','#E85D8A');document.documentElement.style.setProperty('--gbg','#FCEDF3')});
})();
</script>
</body>
</html>
