<style>
  :root{--ink:#241C26;--slate:#5B4E5C;--mut:#9A8C9C;--rose:#E85D8A;--rosed:#B93A67;--line:#F0DFE8;--gc:#C98A1F;
    --serif:'Noto Serif KR',serif;--mono:ui-monospace,'SF Mono',Menlo,monospace}
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:linear-gradient(170deg,#FEF8FA 0%,#FBF7FC 55%,#F7F5FD 100%);color:var(--ink);
    font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo',sans-serif;
    letter-spacing:-.02em;line-height:1.62;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
  .mono{font-family:var(--mono)}
  a{color:inherit;text-decoration:none}
  .mesh{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;opacity:.85}
  .aur{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
  .aur i{position:absolute;display:block;border-radius:50%;filter:blur(80px)}
  .aur .x1{width:620px;height:620px;left:-160px;top:-120px;background:radial-gradient(circle,color-mix(in srgb,var(--gc) 42%,transparent),transparent 66%);opacity:.5}
  .aur .x2{width:680px;height:640px;right:-200px;top:220px;background:radial-gradient(circle,#C7A9F5,transparent 66%);opacity:.22}
  .twrap{max-width:940px;margin:0 auto;padding:0 22px 90px}
  /* header */
  /* 랜딩 헤더와 100% 동일 */
  header{position:sticky;top:0;z-index:60;padding:14px 0;transition:background .25s,box-shadow .25s,padding .25s}
  header.scrolled{background:rgba(255,255,255,.88);backdrop-filter:blur(12px);box-shadow:0 10px 30px -22px rgba(36,28,38,.35);padding:10px 0}
  .hd-in{max-width:1020px;margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between}
  .logo{font-size:19px;font-weight:900}
  .logo .dot{color:var(--rose)}.logo .lab{color:var(--rose);font-weight:800;letter-spacing:.5px}
  .hd-r{display:flex;align-items:center;gap:18px}
  .hd-link{font-size:13.5px;color:var(--slate);font-weight:600;white-space:nowrap}
  .hd-link:hover{color:var(--rosed)}
  .hd-cta{background:linear-gradient(180deg,#3B3240,#241C26);color:#fff;font-size:13.5px;font-weight:700;border-radius:99px;padding:10px 20px;white-space:nowrap;
    box-shadow:0 8px 18px -8px rgba(36,28,38,.5),inset 0 1.5px 0 rgba(255,255,255,.22),inset 0 -2px 4px rgba(0,0,0,.35);transition:transform .16s}
  .hd-cta:hover{transform:translateY(-1.5px)}
  @media(max-width:840px){.hd-in{flex-wrap:wrap;row-gap:2px}.hd-r{flex-wrap:wrap;gap:10px 14px;justify-content:flex-end}.hd-link{font-size:12.5px}.hd-cta{padding:8px 16px;font-size:12px;order:-1}}
  /* hero — 박스 제거, 풀블리드 그룹 밴드(그리드 비침) */
  .thero{position:relative;width:100vw;left:50%;margin-left:-50vw;margin-top:14px;padding:46px 0 42px;
    background:linear-gradient(180deg,color-mix(in srgb,var(--gc) 17%,transparent) 0%,color-mix(in srgb,var(--gc) 8%,transparent) 100%)}
  .thero-in{max-width:940px;margin:0 auto;padding:0 22px;display:grid;grid-template-columns:1.2fr .9fr;gap:10px;align-items:center}
  .tg{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;font-weight:800;letter-spacing:2px;
    color:var(--gc);text-transform:uppercase}
  .tg::before{content:'';width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 9px currentColor}
  .tnick{font-family:var(--serif);font-weight:700;font-size:clamp(34px,6vw,52px);line-height:1.08;margin:12px 0 6px;letter-spacing:-1px}
  .tmeta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--slate);letter-spacing:1.5px}
  .tmeta .code{font-weight:800;letter-spacing:5px;color:var(--ink)}
  .tmeta .pill{font-weight:800;letter-spacing:.4px;border-radius:99px;padding:3px 10px;
    background:color-mix(in srgb,var(--gc) 14%,#fff);border:1px solid color-mix(in srgb,var(--gc) 30%,transparent);color:color-mix(in srgb,var(--gc) 78%,#4a2e3a)}
  .tmeta .rare{color:#fff;background:linear-gradient(135deg,color-mix(in srgb,var(--gc) 82%,#fff),var(--gc));border:0}
  .tlead{margin-top:16px;font-size:16px;color:var(--slate);max-width:440px;word-break:keep-all;font-weight:500}
  .taxes{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
  .ax{display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(255,255,255,.72);border:1px solid var(--line);
    border-radius:14px;padding:9px 12px;min-width:66px}
  .ax b{font-family:var(--mono);font-size:16px;font-weight:800;color:var(--gc)}
  .ax span{font-size:11px;font-weight:700;color:var(--slate)}
  .ax em{font-style:normal;font-size:8.5px;color:var(--mut);letter-spacing:.3px}
  .thero-vis{position:relative;display:flex;justify-content:center;align-items:flex-end;min-height:230px}
  .thero-vis::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-46%);width:280px;height:280px;border-radius:50%;
    background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--gc) 34%,transparent),transparent 64%);z-index:0}
  .tchar{position:relative;z-index:1}
  .tchar img{height:250px;filter:drop-shadow(0 22px 26px color-mix(in srgb,var(--gc) 45%,transparent))}
  /* section nav — 박스 제거, 밑줄 링크 */
  .tnav{display:flex;gap:26px;justify-content:center;flex-wrap:wrap;margin:32px 0 4px}
  .tnav a{font-size:14px;font-weight:700;color:var(--slate);padding:6px 2px;border-bottom:2px solid transparent;transition:color .15s,border-color .15s}
  .tnav a:hover{color:var(--gc);border-color:var(--gc)}
  /* sections — 박스 제거, 구분선 + 큰 글씨 */
  .tsec{padding:0;margin-top:42px;border-top:1px solid var(--line);padding-top:34px;scroll-margin-top:80px}
  .tsec:first-of-type{border-top:none;padding-top:6px}
  .tsec h2{font-family:var(--serif);font-size:24px;font-weight:700;letter-spacing:-.4px;display:flex;align-items:center;gap:12px}
  .tsec h2::before{content:'';width:22px;height:3px;border-radius:9px;background:var(--gc)}
  .tsec p{margin-top:15px;font-size:16px;color:var(--slate);word-break:keep-all;line-height:1.82}
  .tsec.love{background:none}
  .tquote{margin:24px 6px;padding-left:20px;border-left:4px solid color-mix(in srgb,var(--gc) 55%,transparent);
    font-family:var(--serif);font-size:19px;font-weight:600;color:var(--ink);word-break:keep-all;line-height:1.5}
  .tquote span{display:block;margin-top:8px;font-family:var(--mono);font-size:11px;color:var(--mut);letter-spacing:1px}
  /* prev/next + cta */
  .tpn{display:flex;justify-content:space-between;gap:12px;margin-top:30px}
  .tpn a{flex:1;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 18px;transition:border-color .15s,transform .15s;min-width:0}
  .tpn a:hover{border-color:color-mix(in srgb,var(--gc) 45%,transparent);transform:translateY(-2px)}
  .tpn .k{font-family:var(--mono);font-size:10px;color:var(--mut);letter-spacing:1px}
  .tpn .v{font-weight:800;font-size:14px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tpn .nx{text-align:right}
  .tcta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:34px}
  .tcta a{border-radius:99px;padding:15px 28px;font-size:15px;font-weight:800;transition:transform .15s,box-shadow .15s}
  .tcta .home{background:#fff;border:1.5px solid var(--line);color:var(--slate)}
  .tcta .go{color:#fff;background:linear-gradient(135deg,var(--rose),var(--rosed));box-shadow:0 16px 30px -14px rgba(185,58,103,.6)}
  .tcta a:hover{transform:translateY(-2px)}
  @media(max-width:760px){
    .thero{padding:34px 0 30px}.thero-in{grid-template-columns:1fr;text-align:center}
    .tg{justify-content:center}.tmeta{justify-content:center}.tlead{margin-left:auto;margin-right:auto}.taxes{justify-content:center}
    .thero-vis{order:-1;min-height:180px}.tchar img{height:180px}
    .tnav{gap:18px}
  }
</style>
</head>

<script>window.TYPEDESC={"RATI":{"sotm":"연애에서도 계획하고, 챙기고, 표현합니다. 다정한데 빈틈이 잘 없어요. 상대의 말이나 행동을 무의식적으로 '더 나은 버전'으로 고쳐 생각하는 편입니다.","love":"관계를 안정적으로 이끄는 힘이 큽니다. 다만 상대가 은근히 눈치를 보거나 '내가 잘하고 있나?' 싶어질 때가 생길 수 있어요.","tip":"완벽하게 해주기보다, 가끔 빈틈을 보여주는 편이 상대에겐 더 편할 수 있어요. 지적 대신 '이건 이래서 좋더라' 같은 말로 바꿔보면 좋을 것 같아요."},"RATO":{"sotm":"먼저 다가가 챙기고 애정도 곧잘 표현합니다. 상대가 힘들어할 때 곁을 지키는 든든한 사람이에요. 다만 갈등 낌새가 보이면 목소리를 높이기보다 조용히 그 자리를 피하는 편입니다.","love":"상대를 편안하게 감싸주는 힘이 큽니다. 다만 정작 풀어야 할 이야기는 뒤로 미뤄져서, 상대가 '지금 괜찮은 건가' 하고 궁금해질 때가 생길 수 있어요.","tip":"불편한 순간에 잠깐 자리를 피하더라도, '지금은 좀 식히고 이따 얘기하자'처럼 한마디 남겨두면 상대가 덜 불안해할지도 몰라요."},"RAKI":{"sotm":"먼저 다가가고, 문제가 생기면 회피하지 않고 정면으로 다룹니다. 상대가 힘들다고 하면 감정을 겉으로 내기보다 어떻게 도울지부터 빠르게 궁리하는 편이에요.","love":"위기 상황에서 가장 믿음직한 사람입니다. 다만 상대는 위로받고 싶었을 뿐인데 해결책이 먼저 나와서, 마음을 몰라준다고 느낄 때가 생길 수 있어요.","tip":"방법을 꺼내기 전에 '많이 힘들었겠다' 한마디를 먼저 건네보는 건 어떨까요. 상대가 원하는 게 해결인지 공감인지 가볍게 물어봐도 좋을 것 같아요."},"RAKO":{"sotm":"먼저 다가가 곁을 지키지만, 애정이나 힘든 마음을 말로 크게 드러내진 않습니다. 갈등이 생기면 부딪히기보다 조용히 한 발 물러나 삭이는 편이에요. '다 괜찮다'는 말을 자주 합니다.","love":"흔들림 없이 관계를 지탱하는 힘이 큽니다. 다만 속마음을 잘 내비치지 않아서, 상대가 '이 사람은 무슨 생각을 하고 있을까' 하고 답답해질 때가 생길 수 있어요.","tip":"괜찮다는 말 대신 지금 느끼는 걸 한 문장이라도 꺼내보면, 상대가 더 가깝게 느낄지도 몰라요. 말없는 다정함도 가끔은 티를 내주는 편이 오래가기에 좋을 것 같아요."},"RUTI":{"sotm":"좋아하면 마음을 숨기지 않고 전부 보여줍니다. 연락도 자주 먼저 하고, 상대 반응이 평소와 조금만 달라도 금방 알아채서 서운하면 바로 물어보는 편이에요.","love":"사랑에 진심이라 상대는 크게 사랑받는 느낌을 받습니다. 다만 마음이 큰 만큼 작은 신호에도 흔들려서, 상대가 자주 확인해줘야 할 것 같은 부담을 느낄 때가 생길 수 있어요.","tip":"불안할 때 곧바로 확인하기보다 한 박자 두고 마음을 살펴보면 좋을 것 같아요. 이미 받은 애정부터 먼저 떠올려보면 조금 편해질지도 몰라요."},"RUTO":{"sotm":"상대가 원하는 걸 먼저 살피고 맞춰줍니다. 데이트 장소도, 의견이 갈릴 때도 대체로 상대 쪽에 맞추는 편이에요. 정작 자기가 뭘 원하는지는 잘 말하지 않습니다.","love":"배려가 깊어서 함께 있으면 편안합니다. 다만 늘 맞춰주다 보니 상대가 '이 사람은 진짜 뭘 좋아하지?' 하고 궁금해하거나 어느 순간 미안해질 때가 생길 수 있어요.","tip":"가끔은 먼저 원하는 걸 말해보는 것도 좋을 것 같아요. 작은 취향부터 꺼내놓으면 상대도 더 편하게 다가올지도 몰라요."},"RUKI":{"sotm":"마음은 깊은데 티는 잘 안 냅니다. 서운한 게 있어도 한동안 담아뒀다가 어느 날 진심을 한 번에 꺼내놓는 편이에요. 챙기는 건 말보다 행동으로 합니다.","love":"은근하고 오래가는 애정이 강점입니다. 다만 쌓아뒀던 마음이 한꺼번에 나오면 상대는 '이걸 왜 이제야 말하지?' 하고 놀랄 때가 생길 수 있어요.","tip":"서운한 마음은 그때그때 조금씩 나눠 꺼내보면 좋을 것 같아요. 작게라도 표현하면 상대가 마음을 더 일찍 알아챌지도 몰라요."},"RUKO":{"sotm":"깊게 사랑하지만 속으로 오래 간직합니다. 다투거나 지치면 바로 부딪히기보다 잠시 거리를 두고 혼자 감정을 정리하는 편이에요. 끝난 관계도 오래 기억합니다.","love":"사랑의 깊이와 여운이 남다릅니다. 다만 힘들 때 말없이 물러서면 상대는 '지금 무슨 생각을 하는 걸까' 하고 멀어진 듯 느낄 때가 생길 수 있어요.","tip":"혼자 정리하기 전에 '잠깐 생각할 시간이 필요해'라고 한마디만 남겨보면 좋을 것 같아요. 다 말하지 않아도 그 한마디가 상대에겐 큰 안심이 될지도 몰라요."},"BATI":{"sotm":"할 말은 돌리지 않고 정확히 하는 편입니다. 감정 표현도 분명하지만, 마음을 여는 속도는 스스로 정하고 서두르지 않아요.","love":"오해가 쌓이기 전에 대화로 푸는 힘이 있어 관계가 명확합니다. 다만 초반에 상대는 '아직 거리를 두는 건가' 싶어 조금 조심스러워질 때가 생길 수 있어요.","tip":"필요한 말을 꺼낼 때 '왜 이게 중요한지'를 한 문장 덧붙여보면 좋을 것 같아요. 거리를 좁히는 속도도 가끔은 상대에게 살짝 맞춰보는 건 어떨까요."},"BATO":{"sotm":"감정은 솔직하게 드러내지만, 얽매인다는 느낌이 들면 한발 물러나 자기 공간을 지킵니다. 물러서는 건 멀어지려는 게 아니라 잠시 숨 돌릴 틈이 필요한 거예요.","love":"상대의 자유도 존중해줘서 편안한 관계를 만듭니다. 다만 잠시 거리를 둘 때 상대는 '내가 뭘 잘못했나' 하고 불안해질 때가 생길 수 있어요.","tip":"혼자만의 시간이 필요할 때 '잠깐 충전하고 올게' 정도만 미리 말해주면 상대에겐 훨씬 편할 수 있어요. 물러남에 이유를 붙여주는 것만으로 안심이 될지도 몰라요."},"BAKI":{"sotm":"표정은 잔잔해도 속으로는 깊게 느끼는 편입니다. 감정을 자주 꺼내진 않지만, 정작 짚어야 할 문제 앞에서는 피하지 않고 마주합니다.","love":"쉽게 흔들리지 않아 관계에 안정감을 줍니다. 다만 평소 티가 잘 안 나서, 상대가 '이 사람 지금 어떤 마음일까' 궁금해지는 순간이 생길 수 있어요.","tip":"큰 감정이 아니어도 '오늘 이게 좋았어' 같은 짧은 말을 자주 건네보면 좋을 것 같아요. 속으로 느낀 걸 조금만 밖으로 꺼내주면 상대가 마음을 읽기 한결 수월할지도 몰라요."},"BAKO":{"sotm":"혼자서도 충분히 안정된 사람입니다. 감정을 안으로 담아두는 편이고, 문제가 생기면 바로 부딪히기보다 잠시 거리를 두고 정리한 뒤 다룹니다.","love":"상대에게 기대지 않는 단단함이 매력입니다. 다만 그 자족감 때문에 상대가 '내가 굳이 필요한가' 싶어 서운해지는 지점이 생길 수 있어요.","tip":"혼자 정리한 결론을 전할 때, 그 과정을 조금 나눠보면 좋을 것 같아요. 가끔은 '네가 있어서 좋다'는 말을 먼저 건네보는 건 어떨까요."},"BUTI":{"sotm":"처음엔 거리를 두고 지켜보다가, 마음을 열면 누구보다 뜨겁게 표현합니다. 함께일 땐 감정을 숨기지 않고, 부딪힐 일이 생기면 그 자리에서 풀려고 하는 편이에요.","love":"관계에 활력과 솔직함을 불어넣는 힘이 큽니다. 다만 감정의 온도가 오르내릴 때, 상대가 그 폭을 따라가기 벅차지는 순간이 생길 수 있어요.","tip":"뜨거울 때만큼 잔잔한 순간도 함께 나눠보면, 상대가 관계를 더 안정적으로 느낄지도 몰라요. 감정이 크게 올라올 땐 한 박자 쉬고 말해보는 것도 좋을 것 같아요."},"BUTO":{"sotm":"상대의 미묘한 변화나 관계의 어긋남을 남보다 빨리 알아챕니다. 느낀 건 표현하지만, 불안이 커지면 '어차피 안 될 것 같다'며 스스로 한발 물러서기도 해요.","love":"상대의 마음을 섬세하게 읽어주는 힘이 큽니다. 다만 혼자 결론을 내고 거리를 둘 때, 상대는 영문을 모른 채 멀어졌다고 느낄 수 있어요.","tip":"불안한 예감이 들 때 혼자 결론짓기보다, 상대에게 지금 마음을 한번 물어봐 주면 좋을 것 같아요. 그 촉이 늘 맞는 건 아닐지도 모르니까요."},"BUKI":{"sotm":"몰입할 땐 세심하게 챙기고 다정하지만, 주기적으로 혼자만의 시간을 꼭 필요로 합니다. 속에 담아뒀다가도, 풀어야 할 일은 결국 마주 앉아 대화로 다루는 편이에요.","love":"자기 리듬을 지키면서도 문제를 회피하지 않는 안정감이 있습니다. 다만 혼자 있고 싶어질 때, 상대는 자기 탓인가 싶어 눈치를 볼 수 있어요.","tip":"충전이 필요할 때, 그게 관계와 상관없는 '내 리듬'이라고 미리 알려주면 좋을 것 같아요. 담아둔 마음도 조금 일찍 꺼내보면 상대가 편해질지도 몰라요."},"BUKO":{"sotm":"시작할 땐 누구보다 몰입하고 다정합니다. 다만 속마음을 잘 드러내지 않고, 에너지가 떨어지면 조용히 자리를 피해 혼자 식히는 편이에요.","love":"초반에 상대를 깊이 빠져들게 하는 힘이 큽니다. 다만 갑자기 말수가 줄고 거리를 둘 때, 상대는 '식은 건가' 싶어 불안해질 수 있어요.","tip":"지쳐서 물러설 때 '지금은 충전이 좀 필요해'라고 한마디 남겨주면, 상대가 덜 불안해할지도 몰라요. 식은 게 아니라는 걸 짧게라도 전해보는 건 어떨까요."}};</script>

var META={"RATI": {"name": "완벽주의형", "pct": "19.4%", "line": "계획도 다정도 완벽한 연애의 교과서. 가끔 상대를 속으로 첨삭하는 게 흠이라면 흠", "g": "a"}, "RATO": {"name": "품어주는형", "pct": "1.6%", "line": "곁에 있으면 따뜻해지는 보호자. 단, 갈등 낌새엔 화 대신 조용히 불을 줄인다", "g": "a"}, "RAKI": {"name": "해결사형", "pct": "3.1%", "line": "위기에 제일 믿음직한 사람. 근데 위로해달라니까 해결책 3안이 먼저 온다", "g": "a"}, "RAKO": {"name": "버팀목형", "pct": "2.4%", "line": "말없이 곁을 지키는 든든한 사람. 다 괜찮다지만, 그 다정함도 알아줘야 오래간다", "g": "a"}, "RUTI": {"name": "올인형", "pct": "11.3%", "line": "사랑에 전부를 거는 사람. 마음의 크기가 곧 불안의 크기가 되는", "g": "p"}, "RUTO": {"name": "맞춰주는형", "pct": "0.1%", "line": "맞춰주는 다정함의 극한. 맞추다 자기 목소리가 옅어지는, 1,000명 중 1명꼴의 희귀 유형", "g": "p"}, "RUKI": {"name": "속정형", "pct": "8.6%", "line": "서운함도 애정이 커서 생기는 것. 담아뒀다가 한 번에 진심을 꺼낸다", "g": "p"}, "RUKO": {"name": "여운형", "pct": "3.9%", "line": "누구보다 깊게 사랑하고, 누구보다 오래 기억하는 사람. 끝난 뒤에도 여운이 길다", "g": "p"}, "BATI": {"name": "소신형", "pct": "4.6%", "line": "할 말은 정확히 하는 사람. 솔직한 만큼 자기 공간도 확실해서, 거리 좁히는 덴 시간이 필요하다", "g": "b"}, "BATO": {"name": "자유형", "pct": "1.9%", "line": "구속받는 순간 매력을 잃는 사람. 물러서는 건 도망이 아니라 숨 쉴 공간이 필요한 것", "g": "b"}, "BAKI": {"name": "과묵형", "pct": "2.2%", "line": "표정은 잔잔해도 속은 깊다. 감정을 함부로 안 꺼낼 뿐, 안 느끼는 게 아니다", "g": "b"}, "BAKO": {"name": "독립형", "pct": "13.6%", "line": "혼자서도 충분히 완결된 사람. 자족감이 매력이자, 가끔 상대를 서운하게 하는 지점", "g": "b"}, "BUTI": {"name": "열정파형", "pct": "6.4%", "line": "만나면 세상 제일 뜨겁고 즐거운 사람. 대신 그 열기가 식을 땐 온도차가 크다", "g": "r"}, "BUTO": {"name": "직감형", "pct": "0.4%", "line": "관계의 균열을 남보다 먼저 감지하는 촉. 가끔 ‘어차피 안 될 거야’로 스스로를 민다", "g": "r"}, "BUKI": {"name": "충전형", "pct": "5.5%", "line": "몰입할 땐 세상 누구보다 다정하다가도, 주기적으로 혼자만의 계절이 오는 사람. 악의가 아니라 리듬이다", "g": "r"}, "BUKO": {"name": "불꽃형", "pct": "15.0%", "line": "시작은 우주 최강, 뜨거울 때 가장 뜨거운 사람. 식은 게 아니라 연료가 떨어진 것", "g": "r"}};
var ORDER=["RATI","RATO","RAKI","RAKO","RUTI","RUTO","RUKI","RUKO","BATI","BATO","BAKI","BAKO","BUTI","BUTO","BUKI","BUKO"];
var GRP={RA:["확신","SURE","#C98A1F"],RU:["낭만","ROMANCE","#E85D8A"],BA:["여유","EASE","#3D9EA8"],BU:["반전","TWIST","#7C4FD8"]};
var AX={R:["다가감","회피↓"],B:["선긋기","회피↑"],A:["단단함","불안↓"],U:["여림","불안↑"],T:["표현","표현↑"],K:["담아둠","표현↓"],I:["부딪힘","요구"],O:["물러섬","철회"]};
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function rare(pct){var p=parseFloat((pct||"").replace("%",""));return p<=0.5?"초희귀":(p<=2.5?"희귀":null);}
function render(){
  var code=((new URLSearchParams(location.search)).get("code")||"RATI").toUpperCase();
  if(!META[code])code="RATI";
  var m=META[code], d=(window.TYPEDESC||{})[code]||{}, img=(window.RATI_CHARS||{})[code];
  var g=GRP[code.slice(0,2)]||GRP.RA;
  document.documentElement.style.setProperty("--gc",g[2]);
  document.title=m.name+" · RATI 연애 유형";
  document.getElementById("tg").textContent=g[0]+" · "+g[1];
  document.getElementById("tnick").textContent=m.name;
  var rr=rare(m.pct);
  var meta='<span class="code">'+code.split("").join(" ")+'</span>'
    +'<span class="pill">실측 '+esc(m.pct)+'</span>'
    +(rr?'<span class="pill rare">'+rr+'</span>':'');
  document.getElementById("tmeta").innerHTML=meta;
  document.getElementById("tlead").textContent=m.line;
  document.getElementById("taxes").innerHTML=code.split("").map(function(ch){
    var a=AX[ch]||["",""];return '<div class="ax"><b>'+ch+'</b><span>'+a[0]+'</span><em>'+a[1]+'</em></div>';
  }).join("");
  if(img)document.getElementById("tchar").innerHTML='<img alt="'+esc(m.name)+'" src="'+img+'">';
  document.getElementById("p1").textContent=d.sotm||m.line;
  document.getElementById("p2").textContent=d.love||"";
  document.getElementById("p3").textContent=d.tip||"";
  document.getElementById("tquote").innerHTML=esc(m.line)+'<span>— '+code+' · '+esc(m.name)+'</span>';
  // prev / next
  var i=ORDER.indexOf(code), pv=ORDER[(i+ORDER.length-1)%ORDER.length], nx=ORDER[(i+1)%ORDER.length];
  document.getElementById("tpn").innerHTML=
    '<a href="type.html?code='+pv+'"><div class="k">← 이전</div><div class="v">'+esc(META[pv].name)+'</div></a>'
   +'<a class="nx" href="type.html?code='+nx+'"><div class="k">다음 →</div><div class="v">'+esc(META[nx].name)+'</div></a>';
}
render();
window.addEventListener('scroll',function(){var h=document.querySelector('header');if(h)h.classList.toggle('scrolled',(window.scrollY||0)>10)},{passive:true});
</script>
<style id="mobile-polish-type">
@media (max-width:560px){
  .hd-in{flex-wrap:nowrap;gap:12px}
  .hd-r{flex-wrap:nowrap;min-width:0;overflow-x:auto;justify-content:flex-start;gap:14px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .hd-r::-webkit-scrollbar{display:none}
  .hd-link,.hd-cta{flex:0 0 auto}
  .tsec{scroll-margin-top:72px}
  h1,h2,h3{word-break:keep-all;overflow-wrap:break-word}
}
</style>
</body>
